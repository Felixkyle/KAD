<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Spotlight Admin — KADIS</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0B0C0F;
            --bg-2: #131519;
            --bg-3: #1A1D22;
            --bg-4: #20232A;
            --ink: #EDEEEC;
            --ink-dim: #9A9FA8;
            --ink-dimmer: #5C616A;
            --line: rgba(255, 255, 255, .07);
            --line-b: rgba(255, 255, 255, .13);
            --amber: #D9772E;
            --amber-soft: #E8A15E;
            --red: #e5534b;
            --green: #3fb950
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh
        }

        h1,
        h2,
        h3 {
            font-family: 'Sora', sans-serif;
            letter-spacing: -.02em
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 28px 20px 80px
        }

        .hide {
            display: none !important
        }

        /* login */
        .login {
            max-width: 380px;
            margin: 12vh auto 0;
            background: var(--bg-2);
            border: 1px solid var(--line-b);
            border-radius: 18px;
            padding: 30px
        }

        .login h2 {
            font-size: 22px;
            margin-bottom: 6px
        }

        .login p {
            color: var(--ink-dim);
            font-size: 13.5px;
            margin-bottom: 22px
        }

        label {
            display: block;
            font-size: 12px;
            font-family: 'Space Mono';
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--ink-dim);
            margin: 14px 0 6px
        }

        input[type=text],
        input[type=email],
        input[type=password],
        input[type=number],
        textarea {
            width: 100%;
            background: var(--bg-3);
            border: 1px solid var(--line-b);
            border-radius: 10px;
            color: var(--ink);
            padding: 12px 14px;
            font: inherit;
            font-size: 14px;
            outline: none
        }

        input:focus,
        textarea:focus {
            border-color: var(--amber)
        }

        textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.55
        }

        .hint {
            font-size: 12px;
            color: var(--ink-dimmer);
            margin-top: 6px
        }

        .btn {
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13.5px;
            transition: all .2s
        }

        .btn-primary {
            background: var(--amber);
            color: #0B0C0F
        }

        .btn-primary:hover {
            background: var(--amber-soft)
        }

        .btn-primary:disabled {
            opacity: .6;
            cursor: wait
        }

        .btn-ghost {
            background: var(--bg-3);
            color: var(--ink);
            border: 1px solid var(--line-b)
        }

        .btn-ghost:hover {
            border-color: var(--amber)
        }

        .btn-danger {
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(229, 83, 75, .4)
        }

        .btn-danger:hover {
            background: rgba(229, 83, 75, .1)
        }

        .btn-sm {
            padding: 7px 11px;
            font-size: 12px;
            border-radius: 8px
        }

        .full {
            width: 100%;
            margin-top: 20px
        }

        /* top bar */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 26px
        }

        .top h1 {
            font-size: 24px
        }

        .top small {
            color: var(--ink-dim);
            font-size: 12.5px;
            display: block;
            margin-top: 4px
        }

        .top .acts {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        /* list */
        .row {
            display: grid;
            grid-template-columns: 72px 1fr auto;
            gap: 16px;
            align-items: center;
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px
        }

        .row.off {
            opacity: .55
        }

        .thumb {
            width: 72px;
            height: 72px;
            background: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden
        }

        .thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain
        }

        .info .cat {
            font-size: 10.5px;
            font-family: 'Space Mono';
            letter-spacing: .1em;
            color: var(--amber-soft);
            text-transform: uppercase
        }

        .info .ttl {
            font-weight: 700;
            font-size: 14.5px;
            margin: 3px 0
        }

        .info .prc {
            font-size: 12.5px;
            color: var(--ink-dim)
        }

        .info .prc s {
            color: var(--ink-dimmer);
            margin-right: 6px
        }

        .row-acts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end
        }

        .empty {
            text-align: center;
            color: var(--ink-dim);
            padding: 50px 10px;
            border: 1px dashed var(--line-b);
            border-radius: 14px
        }

        /* editor */
        .editor-bg {
            position: fixed;
            inset: 0;
            background: rgba(5, 6, 8, .78);
            backdrop-filter: blur(5px);
            z-index: 50;
            display: none;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            padding: 30px 14px
        }

        .editor-bg.open {
            display: flex
        }

        .editor {
            background: var(--bg-2);
            border: 1px solid var(--line-b);
            border-radius: 18px;
            width: 100%;
            max-width: 560px;
            padding: 26px;
            margin: auto
        }

        .editor h2 {
            font-size: 20px;
            margin-bottom: 4px
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .preview {
            margin-top: 10px;
            width: 110px;
            height: 110px;
            background: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden
        }

        .preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain
        }

        .check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            font-size: 14px
        }

        .check input {
            width: 18px;
            height: 18px;
            accent-color: var(--amber)
        }

        .ed-acts {
            display: flex;
            gap: 10px;
            margin-top: 24px
        }

        .ed-acts .btn {
            flex: 1
        }

        #msg {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-4);
            border: 1px solid var(--line-b);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13.5px;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s
        }

        #msg.show {
            opacity: 1
        }

        #msg.err {
            border-color: var(--red);
            color: #ffb4ae
        }

        #msg.ok {
            border-color: var(--green)
        }

        @media(max-width:600px) {
            .row {
                grid-template-columns: 60px 1fr
            }

            .row-acts {
                grid-column: 1/-1;
                justify-content: flex-start
            }

            .thumb {
                width: 60px;
                height: 60px
            }

            .two {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="login" id="loginView">
        <h2>Spotlight Admin</h2>
        <p>Sign in to manage the Service Spotlight cards on the homepage.</p>
        <label for="em">Email</label>
        <input type="email" id="em" autocomplete="username">
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password">
        <button class="btn btn-primary full" id="loginBtn">Sign in</button>
    </div>

    <!-- DASHBOARD -->
    <div class="wrap hide" id="dashView">
        <div class="top">
            <div>
                <h1>Service Spotlight</h1>
                <small id="who"></small>
            </div>
            <div class="acts">
                <button class="btn btn-primary" id="addBtn">+ Add card</button>
                <button class="btn btn-ghost" id="outBtn">Sign out</button>
            </div>
        </div>
        <div id="list"></div>
    </div>

    <!-- EDITOR -->
    <div class="editor-bg" id="edBg">
        <div class="editor">
            <h2 id="edTitle">Add card</h2>
            <label>Category label</label>
            <input type="text" id="fCat" placeholder="e.g. CCTV CAMERA">
            <label>Title</label>
            <input type="text" id="fTitle" placeholder="e.g. 4-Channels CCTV KIT + Site Installation">
            <label>Key features</label>
            <textarea id="fFeat" placeholder="One feature per line"></textarea>
            <div class="hint">Type one feature per line. Each line becomes a bullet.</div>
            <div class="two">
                <div><label>Old price (₦)</label><input type="number" id="fOld" min="0" placeholder="250000"></div>
                <div><label>New price (₦)</label><input type="number" id="fNew" min="0" placeholder="200000"></div>
            </div>
            <label>Image</label>
            <input type="file" id="fFile" accept="image/*" style="color:var(--ink-dim);font-size:13px">
            <div class="hint">Upload a new image, or leave empty to keep the current one.</div>
            <div class="preview hide" id="prev"><img id="prevImg" alt=""></div>
            <label class="check"><input type="checkbox" id="fOn" checked> Show this card on the website</label>
            <div class="ed-acts">
                <button class="btn btn-ghost" id="edCancel">Cancel</button>
                <button class="btn btn-primary" id="edSave">Save</button>
            </div>
        </div>
    </div>

    <div id="msg"></div>

    <script>
        /* ====== CONFIG ====== */
        const SUPABASE_URL = "https://xjaieymgmhberbkbucrh.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_r86lqj5QiI3qTgXicj7Ryg_AWkXZXu6";
        const TABLE = 'service_spotlight';
        const BUCKET = 'spotlight';

        const sb = window.sb || supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const naira = n => '₦' + Number(n).toLocaleString('en-NG');

        let rows = [];
        let editingId = null;
        let currentImage = '';

        function toast(text, type) {
            const m = $('msg'); m.textContent = text; m.className = 'show ' + (type || '');
            clearTimeout(toast.t); toast.t = setTimeout(() => m.className = '', 2800);
        }

        /* ====== AUTH ====== */
        async function showApp(session) {
            $('loginView').classList.add('hide');
            $('dashView').classList.remove('hide');
            $('who').textContent = 'Signed in as ' + session.user.email;
            await load();
        }
        function showLogin() {
            $('dashView').classList.add('hide');
            $('loginView').classList.remove('hide');
        }
        $('loginBtn').onclick = async () => {
            const btn = $('loginBtn'); btn.disabled = true;
            const { data, error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
            btn.disabled = false;
            if (error) return toast(error.message, 'err');
            showApp(data.session);
        };
        $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
        $('outBtn').onclick = async () => { await sb.auth.signOut(); showLogin(); };
        sb.auth.getSession().then(({ data }) => data.session ? showApp(data.session) : showLogin());

        /* ====== LIST ====== */
        async function load() {
            const { data, error } = await sb.from(TABLE).select('*')
                .order('sort_order', { ascending: true }).order('created_at', { ascending: false });
            if (error) return toast('Could not load: ' + error.message, 'err');
            rows = data || [];
            render();
        }

        function render() {
            const list = $('list');
            if (!rows.length) { list.innerHTML = '<div class="empty">No cards yet. Tap “+ Add card” to create your first one.</div>'; return; }
            list.innerHTML = rows.map((r, i) => `
    <div class="row ${r.is_active ? '' : 'off'}" data-id="${esc(r.id)}">
      <div class="thumb">${r.image_url ? `<img src="${esc(r.image_url)}" alt="">` : ''}</div>
      <div class="info">
        <div class="cat">${esc(r.category)}${r.is_active ? '' : ' · hidden'}</div>
        <div class="ttl">${esc(r.title)}</div>
        <div class="prc">${r.old_price ? `<s>${naira(r.old_price)}</s>` : ''}${naira(r.new_price)}</div>
      </div>
      <div class="row-acts">
        <button class="btn btn-ghost btn-sm" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn btn-ghost btn-sm" data-act="down" ${i === rows.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="btn btn-ghost btn-sm" data-act="toggle">${r.is_active ? 'Hide' : 'Show'}</button>
        <button class="btn btn-ghost btn-sm" data-act="edit">Edit</button>
        <button class="btn btn-danger btn-sm" data-act="del">Delete</button>
      </div>
    </div>`).join('');
        }

        $('list').addEventListener('click', async e => {
            const b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
            const id = b.closest('.row').dataset.id;
            const idx = rows.findIndex(r => r.id === id);
            const act = b.dataset.act;

            if (act === 'edit') return openEditor(rows[idx]);

            if (act === 'toggle') {
                const { error } = await sb.from(TABLE).update({ is_active: !rows[idx].is_active }).eq('id', id);
                if (error) return toast(error.message, 'err');
                toast(rows[idx].is_active ? 'Card hidden' : 'Card is now live', 'ok');
                return load();
            }

            if (act === 'del') {
                if (!confirm('Delete “' + rows[idx].title + '”? This cannot be undone.')) return;
                const { error } = await sb.from(TABLE).delete().eq('id', id);
                if (error) return toast(error.message, 'err');
                toast('Card deleted', 'ok');
                return load();
            }

            if (act === 'up' || act === 'down') {
                const j = act === 'up' ? idx - 1 : idx + 1;
                const order = rows.slice();[order[idx], order[j]] = [order[j], order[idx]];
                const results = await Promise.all(order.map((r, n) => sb.from(TABLE).update({ sort_order: n + 1 }).eq('id', r.id)));
                if (results.some(r => r.error)) return toast('Could not reorder', 'err');
                return load();
            }
        });

        /* ====== EDITOR ====== */
        function openEditor(r) {
            editingId = r ? r.id : null;
            currentImage = r ? (r.image_url || '') : '';
            $('edTitle').textContent = r ? 'Edit card' : 'Add card';
            $('fCat').value = r ? r.category : '';
            $('fTitle').value = r ? r.title : '';
            $('fFeat').value = r && Array.isArray(r.features) ? r.features.join('\n') : '';
            $('fOld').value = r && r.old_price ? r.old_price : '';
            $('fNew').value = r ? r.new_price : '';
            $('fOn').checked = r ? !!r.is_active : true;
            $('fFile').value = '';
            setPreview(currentImage);
            $('edBg').classList.add('open');
        }
        function closeEditor() { $('edBg').classList.remove('open'); }
        function setPreview(src) {
            $('prev').classList.toggle('hide', !src);
            if (src) $('prevImg').src = src;
        }
        $('addBtn').onclick = () => openEditor(null);
        $('edCancel').onclick = closeEditor;
        $('edBg').addEventListener('click', e => { if (e.target === $('edBg')) closeEditor(); });
        $('fFile').onchange = e => {
            const f = e.target.files[0];
            if (f) setPreview(URL.createObjectURL(f));
        };

        $('edSave').onclick = async () => {
            const category = $('fCat').value.trim();
            const title = $('fTitle').value.trim();
            const features = $('fFeat').value.split('\n').map(s => s.trim()).filter(Boolean);
            const newPrice = $('fNew').value;
            const oldPrice = $('fOld').value;
            const file = $('fFile').files[0];

            if (!category || !title) return toast('Category and title are required', 'err');
            if (newPrice === '' || Number(newPrice) < 0) return toast('Enter the new price', 'err');
            if (!currentImage && !file) return toast('Please add an image', 'err');
            if (file && file.size > 3 * 1024 * 1024) return toast('Image is too big. Keep it under 3 MB.', 'err');

            const btn = $('edSave'); btn.disabled = true; btn.textContent = 'Saving…';
            try {
                let image_url = currentImage;
                if (file) {
                    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
                    const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
                    const up = await sb.storage.from(BUCKET).upload(path, file, { cacheControl: '3600', upsert: false });
                    if (up.error) throw up.error;
                    image_url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
                }

                const payload = {
                    category, title, features, image_url,
                    old_price: oldPrice === '' ? null : Number(oldPrice),
                    new_price: Number(newPrice),
                    is_active: $('fOn').checked
                };

                let res;
                if (editingId) {
                    res = await sb.from(TABLE).update(payload).eq('id', editingId);
                } else {
                    payload.sort_order = rows.length ? Math.max(...rows.map(r => r.sort_order || 0)) + 1 : 1;
                    res = await sb.from(TABLE).insert(payload);
                }
                if (res.error) throw res.error;

                toast(editingId ? 'Card updated' : 'Card added', 'ok');
                closeEditor();
                load();
            } catch (err) {
                toast(err.message || 'Something went wrong', 'err');
            } finally {
                btn.disabled = false; btn.textContent = 'Save';
            }
        };
    </script>
</body>

</html>
